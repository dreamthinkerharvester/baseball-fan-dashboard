name: Crawl KBO data

on:
  schedule:
    # KST 17:00~23:30 (= UTC 08:00~14:30) — KBO 경기시간대 30분마다 standings
    # KST 06:00 (= UTC 21:00) — 일 1회 schedule + standings
    # KST 12:00 (= UTC 03:00) — 일 1회 schedule (오전 발표 라인업 대비)
    - cron: '*/30 8-14 * * *'
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Playwright browser (schedule crawler 가 사용)
      - run: pnpm exec playwright install --with-deps chromium

      - name: Crawl standings
        run: pnpm crawl:standings
        continue-on-error: true

      - name: Crawl schedule (browser)
        run: pnpm crawl:schedule:browser
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain data/) ]]; then
            git add data/
            git commit -m "chore(crawl): auto-update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no data changes"
          fi
